<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Media Tracker</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

<div class="container">
    <div class="nav-header">
        <h1>🎬 Tracker de Mídias Universal</h1>
        <a href="perfil.html" class="btn-nav-perfil">📊 Meu Perfil & Estatísticas MAL</a>
    </div>
    
    <div class="search-box">
        <input type="text" id="search-input" placeholder="Pesquisar filmes, séries ou animes no catálogo global...">
        <button id="search-button">Buscar</button>
    </div>

    <div id="watching-section" style="display:none;">
        <div class="section-title">📺 Assistindo Atualmente</div>
        <div id="watching-grid" class="grid"></div>
    </div>

    <div id="recent-section" style="display:none;">
        <div class="section-title">⏱️ Adicionados Recentemente</div>
        <div id="recent-grid" class="grid"></div>
    </div>

    <div class="section-title">🔍 Resultados da Pesquisa</div>
    <div id="results-grid" class="grid"><p style="color:#666;">Digite algo acima para iniciar...</p></div>
</div>
<script type="module" src="/src/home/home.js"></script>
</body>
</html>
