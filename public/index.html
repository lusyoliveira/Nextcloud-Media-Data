<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Media Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 12px 24px; background: #0082c9; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #006699; }
        .section-title { font-size: 20px; margin: 30px 0 15px 0; border-left: 5px solid #0082c9; padding-left: 10px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; position: relative; }
        .card img { width: 100%; height: 320px; object-fit: cover; background: #ddd; }
        .card-content { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .title { font-size: 15px; font-weight: bold; margin: 0 0 5px 0; }
        .badge { display: inline-block; padding: 2px 6px; font-size: 10px; border-radius: 10px; font-weight: bold; color: white; margin-bottom: 8px; text-transform: uppercase; }
        .badge-anime { background: #ff4757; }
        .badge-filme { background: #1e90ff; }
        .badge-série { background: #2ed573; }
        .form-tracker { background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid #e3e3e3; margin-top: 10px; display: none; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 8px; }
        .form-row { display: flex; gap: 8px; }
        .form-group label { font-size: 10px; font-weight: bold; color: #555; margin-bottom: 3px; text-transform: uppercase; }
        .form-tracker select, .form-tracker input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; background: white; width: 100%; box-sizing: border-box; }
        .form-row-check { flex-direction: row; align-items: center; gap: 5px; margin: 5px 0; }
        .form-row-check input { width: auto; }
        .btn-salvar { width: 100%; margin-top: 8px; padding: 8px; background: #2ed573; color: white; font-size: 13px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .status-select { font-weight: bold; color: #0082c9; width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
        .btn-nav-perfil { padding: 12px 20px; background: #2ed573; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <h1>🎬 Tracker de Mídias Universal</h1>
        <a href="perfil.html" class="btn-nav-perfil">📊 Meu Perfil & Estatísticas MAL</a>
    </div>
    
    <div class="search-box">
        <input type="text" id="search-input" placeholder="Pesquisar filmes, séries ou animes no catálogo global...">
        <button id="search-button">Buscar</button>
    </div>

    <div id="watching-section" style="display:none;">
        <div class="section-title">📺 Assistindo Atualmente</div>
        <div id="watching-grid" class="grid"></div>
    </div>

    <div id="recent-section" style="display:none;">
        <div class="section-title">⏱️ Adicionados Recentemente</div>
        <div id="recent-grid" class="grid"></div>
    </div>

    <div class="section-title">🔍 Resultados da Pesquisa</div>
    <div id="results-grid" class="grid"><p style="color:#666;">Digite algo acima para iniciar...</p></div>
</div>
<script>
    const searchInput = document.getElementById('search-input');
    const searchButton = document.getElementById('search-button');
    const resultsGrid = document.getElementById('results-grid');

    window.addEventListener('DOMContentLoaded', carregarListasHome);

    searchButton.addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) buscarMidias(query);
    });

    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const query = searchInput.value.trim();
            if (query) buscarMidias(query);
        }
    });

    async function carregarListasHome() {
        try {
            const response = await fetch('/api/list');
            const data = await response.json();
            if (!data.list || data.list.length === 0) return;

            const emProgresso = data.list.filter(item => item.status === 'watching');
            if (emProgresso.length > 0) {
                document.getElementById('watching-section').style.display = 'block';
                renderizarGradeEstatico(emProgresso, 'watching-grid');
            }

            const recentes = [...data.list].sort((a,b) => new Date(b.addedAt) - new Date(a.addedAt)).slice(0, 4);
            if (recentes.length > 0) {
                document.getElementById('recent-section').style.display = 'block';
                renderizarGradeEstatico(recentes, 'recent-grid');
            }
        } catch (e) { console.error(e); }
    }

    async function buscarMidias(nome) {
        resultsGrid.innerHTML = '<p>Buscando no catálogo do TMDB...</p>';
        try {
            const response = await fetch('/api/search?query=' + encodeURIComponent(nome));
            const data = await response.json();
            renderizarCardsBusca(data.results);
        } catch (error) {
            resultsGrid.innerHTML = '<p>Erro na conexão com o servidor.</p>';
        }
    }

    function renderizarCardsBusca(items) {
        resultsGrid.innerHTML = '';
        if (!items || items.length === 0) {
            resultsGrid.innerHTML = '<p>Nenhuma mídia encontrada no TMDB.</p>';
            return;
        }
        items.forEach(item => { resultsGrid.appendChild(criarCardMidia(item, false)); });
    }

    function renderizarGradeEstatico(items, elementId) {
        const grid = document.getElementById(elementId);
        grid.innerHTML = '';
        items.forEach(item => { grid.appendChild(criarCardMidia(item, true)); });
    }

    function criarCardMidia(item, isEstatico) {
        const card = document.createElement('div');
        card.className = 'card';
        const capa = item.image ? item.image : "https://placeholder.co";
        const tituloLimpo = item.title.replace(/"/g, '&quot;').replace(/'/g, "\\'");
        
        let areaAcaoHtml = '';
        if (!isEstatico) {
            areaAcaoHtml = 
                '<select id="status-' + item.id + '" class="status-select" onchange="alternarFormulario(\'' + item.id + '\', this.value)">' +
                    '<option value="">-- Mudar Status --</option>' +
                    '<option value="watching">Assistindo</option>' +
                    '<option value="completed">Completado</option>' +
                    '<option value="plan_to_watch">Planejado</option>' +
                    '<option value="dropped">Abandonado</option>' +
                    '<option value="on_hold">Em Espera</option>' +
                '</select>' +
                '<div id="form-' + item.id + '" class="form-tracker">' +
                    '<div class="form-group"><label>Plataforma</label>' +
                        '<select id="plat-' + item.id + '">' +
                            '<option value="Netflix">Netflix</option><option value="Crunchyroll">Crunchyroll</option>' +
                            '<option value="Disney+">Disney+</option><option value="Prime Video">Prime Video</option>' +
                            '<option value="Max">Max</option><option value="Stremio">Stremio/Torrent</option>' +
                        '</select>' +
                    '</div>' +
                    '<div class="form-row">' +
                        '<div class="form-group" style="flex:1;"><label>Minha Nota TMDB</label>' +
                            '<select id="rate-' + item.id + '">' +
                                '<option value="10">⭐ (10) Obra-Prima</option><option value="9">⭐ (9) Excelente</option>' +
                                '<option value="8">⭐ (8) Muito Bom</option><option value="7">⭐ (7) Bom</option>' +
                                '<option value="6">⭐ (6) OK</option><option value="5">⭐ (5) Mediano</option>' +
                                '<option value="4">⭐ (4) Ruim</option><option value="3">⭐ (3) Muito Ruim</option>' +
                                '<option value="2">⭐ (2) Horrível</option><option value="1">⭐ (1) Tragédia</option>' +
                            '</select>' +
                        '</div>' +
                        '<div class="form-group" style="width:75px;"><label>Episódios</label>' +
                            '<input type="number" id="ep-' + item.id + '" value="0" min="0">' +
                        '</div>' +
                    '</div>' +
                    '<div class="form-group form-row-check">' +
                        '<input type="checkbox" id="rew-' + item.id + '"><label for="rew-' + item.id + '">Estou revendo</label>' +
                    '</div>' +
                    '<div class="form-row">' +
                        '<div class="form-group"><label>Início</label><input type="date" id="start-' + item.id + '"></div>' +
                        '<div class="form-group"><label>Fim</label><input type="date" id="end-' + item.id + '"></div>' +
                    '</div>' +
                    '<button class="btn-salvar" onclick="salvarItemCompleto(\'' + item.id + '\',\'' + tituloLimpo + '\',\'' + item.type + '\',\'' + capa + '\')">Confirmar</button>' +
                '</div>';
        } else {
            areaAcaoHtml = '<p style="margin:5px 0 0 0; font-size:12px; color:#666;">📍 Plataforma: '+(item.platform || 'N/I')+'</p>';
        }

        card.innerHTML = 
            '<img src="' + capa + '" alt="' + tituloLimpo + '">' +
            '<div class="card-content">' +
                '<div>' +
                    '<span class="badge badge-' + item.type.toLowerCase() + '">' + item.type + '</span>' +
                    '<h3 class="title">' + item.title + '</h3>' +
                '</div>' +
                '<div>' + areaAcaoHtml + '</div>' +
            '</div>';
        return card;
    }

    function alternarFormulario(id, val) {
        document.getElementById('form-' + id).style.display = val !== "" ? 'block' : 'none';
    }

    async function salvarItemCompleto(id, title, type, image) {
        const bodyData = {
            mediaId: id, title, type, image,
            status: document.getElementById('status-' + id).value,
            platform: document.getElementById('plat-' + id).value,
            myRating: document.getElementById('rate-' + id).value,
            episodesCount: document.getElementById('ep-' + id).value,
            isRewatched: document.getElementById('rew-' + id).checked,
            startDate: document.getElementById('start-' + id).value,
            endDate: document.getElementById('end-' + id).value,
        };

        try {
            const response = await fetch('/api/list/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });
            if ((await response.json()).success) {
                alert('Salvo na coleção!');
                location.reload();
            }
        } catch (e) { alert('Erro ao salvar.'); }
    }
</script>
</body>
</html>
