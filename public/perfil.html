<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas MAL Style</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121214; margin: 0; padding: 20px; color: #e1e1e6; }
        .container { max-width:1024px; margin: 0 auto; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #29292e; padding-bottom: 15px; }
        .btn-nav { padding: 10px 20px; background: #0082c9; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-weight: bold; font-size: 14px; }
        
        /* Layout MAL Box */
        .mal-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .mal-box { background: #1c1c1f; border-radius: 6px; padding: 20px; border: 1px solid #29292e; }
        .mal-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #323238; padding-bottom: 5px; display: flex; justify-content: space-between; }
        .mal-title span { color: #0082c9; }
        
        .mal-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
        .mal-row .label { color: #a4a4b5; }
        .mal-meta { display: flex; gap: 40px; background: #202024; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; }
        .mal-meta strong { color: #fff; font-size: 16px; }

        /* Barra de Cores Acumulativa do MAL */
        .mal-bar { height: 14px; background: #48484a; border-radius: 3px; display: flex; overflow: hidden; margin-bottom: 18px; }
        .bar-watch { background: #2ed573; height: 100%; }
        .bar-comp { background: #1e90ff; height: 100%; }
        .bar-hold { background: #ffa500; height: 100%; }
        .bar-drop { background: #ff4757; height: 100%; }
        .bar-plan { background: #747d8c; height: 100%; }

        /* Pontos de Legenda */
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .dot-watch { background: #2ed573; }
        .dot-comp { background: #1e90ff; }
        .dot-hold { background: #ffa500; }
        .dot-drop { background: #ff4757; }
        .dot-plan { background: #747d8c; }

        /* Listas de Favoritos (Tops) */
        .top-section { margin-top: 40px; }
        .top-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .top-item { background: #1c1c1f; border-radius: 4px; padding: 10px; display: flex; align-items: center; gap: 12px; border: 1px solid #29292e; }
        .top-item img { width: 50px; height: 70px; object-fit: cover; border-radius: 3px; background: #323238; }
        .top-rank { font-size: 18px; font-weight: bold; color: #ffa500; width: 25px; text-align: center; }
        .top-info h4 { margin: 0 0 4px 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; color: #fff; }
        .top-info small { color: #a4a4b5; }

        /* Painel de Estatísticas */
        .stats-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .stat-card { background: #1c1c1f; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; border-top: 4px solid #ccc; }
        .stat-card .num { font-size: 28px; font-weight: bold; margin-top: 5px; }
        .stat-card .label { font-size: 12px; color: #666; text-transform: uppercase; font-weight: bold; }
        
        /* Cores dos blocos de estatísticas baseados no status */
        .stat-total { border-top-color: #333; }
        .stat-watching { border-top-color: #2ed573; color: #2ed573; }
        .stat-completed { border-top-color: #1e90ff; color: #1e90ff; }
        .stat-plan { border-top-color: #ffa500; color: #ffa500; }
        .stat-dropped { border-top-color: #ff4757; color: #ff4757; }
        .stat-hold { border-top-color: #747d8c; color: #747d8c; }

        /* Grade de Itens Salvos */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { background: #1c1c1f; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: row; height: 180px; }
        .card img { width: 120px; height: 100%; object-fit: cover; background: #ddd; flex-shrink: 0; }
        .card-content { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
        .title { font-size: 15px; font-weight: bold; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Badges e Infos Internas */
        .badge { display: inline-block; padding: 2px 6px; font-size: 10px; border-radius: 10px; font-weight: bold; color: white; margin-bottom: 6px; text-transform: uppercase; }
        .badge-watching { background: #2ed573; }
        .badge-completed { background: #1e90ff; }
        .badge-plan_to_watch { background: #ffa500; }
        .badge-dropped { background: #ff4757; }
        .badge-on_hold { background: #747d8c; }

        .user-details { font-size: 12px; color: #555; line-height: 1.4; margin: 0; }
        .user-details strong { color: #222; }
        .rating-indicator { font-size: 12px; font-weight: bold; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <h1>📊 Estatísticas Gerais do Perfil</h1>
        <a href="index.html" class="btn-nav">🔍 Voltar para a Busca</a>
    </div>

    <!-- Painel de Contadores Dinâmicos -->
    <div class="stats-panel">
        <div class="stat-card stat-total"><div class="label">Total Salvo</div><div id="stat-total-val" class="num">0</div></div>
        <div class="stat-card stat-watching"><div class="label">Assistindo</div><div id="stat-watching-val" class="num">0</div></div>
        <div class="stat-card stat-completed"><div class="label">Completados</div><div id="stat-completed-val" class="num">0</div></div>
        <div class="stat-card stat-plan"><div class="label">Planejados</div><div id="stat-plan-val" class="num">0</div></div>
        <div class="stat-card stat-dropped"><div class="label">Abandonados</div><div id="stat-dropped-val" class="num">0</div></div>
        <div class="stat-card stat-hold"><div class="label">Em Espera</div><div id="stat-hold-val" class="num">0</div></div>
    </div>

    <h2>📋 Minha Coleção</h2>
    <!-- Grid onde as mídias salvas vão aparecer -->
    <div id="saved-grid" class="grid"></div>

    <h2>📋 Estatisticas</h2>
    <!-- Seção dos blocos visuais MAL -->
    <div id="stats-wrapper" class="mal-container"></div>

    <!-- Seção de Pódios e Recomendações -->
    <div class="top-section">
        <h2>🏆 Meus Melhores Avaliados (Top 3)</h2>
        
        <h3 style="color:#ff4757; border-bottom: 1px solid #ff4757; padding-bottom:4px;">🔥 Melhores Animes</h3>
        <div id="top-anime-grid" class="top-grid"></div>

        <h3 style="color:#2ed573; border-bottom: 1px solid #2ed573; padding-bottom:4px;">📺 Melhores Séries</h3>
        <div id="top-serie-grid" class="top-grid"></div>

        <h3 style="color:#1e90ff; border-bottom: 1px solid #1e90ff; padding-bottom:4px;">🎬 Melhores Filmes</h3>
        <div id="top-filme-grid" class="top-grid"></div>
    </div>
</div>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        renderizarEstatisticasMAL();
        renderizarTopMidias();
        carregarEstatisticas();
        carregarListaPessoal();
    });

    async function renderizarEstatisticasMAL() {
        const wrapper = document.getElementById('stats-wrapper');
        try {
            const response = await fetch('/api/stats');
            const data = await response.json();

            Object.keys(data).forEach(tipo => {
                const info = data[tipo];
                const total = info.totalEntries || 1;

                // Frações proporcionais para a linha empilhada
                const pWatch = (info.watching / total) * 100;
                const pComp = (info.completed / total) * 100;
                const pHold = (info.on_hold / total) * 100;
                const pDrop = (info.dropped / total) * 100;
                const pPlan = (info.plan_to_watch / total) * 100;

                const box = document.createElement('div');
                box.className = 'mal-box';
                box.innerHTML = 
                    '<div class="mal-title">' + tipo + ' Stats</div>' +
                    '<div class="mal-meta">' +
                        '<div>Dias gastos: <strong>' + info.days + ' d</strong></div>' +
                        '<div>Nota Média: <strong>' + (info.meanScore || '0.0') + '</strong></div>' +
                    '</div>' +
                    '<div class="mal-bar">' +
                        '<div class="bar-watch" style="width:'+pWatch+'%"></div>' +
                        '<div class="bar-comp" style="width:'+pComp+'%"></div>' +
                        '<div class="bar-hold" style="width:'+pHold+'%"></div>' +
                        '<div class="bar-drop" style="width:'+pDrop+'%"></div>' +
                        '<div class="bar-plan" style="width:'+pPlan+'%"></div>' +
                    '</div>' +
                    '<div class="mal-row"><div><span class="dot dot-watch"></span><span class="label">Watching</span></div><strong>' + info.watching + '</strong></div>' +
                    '<div class="mal-row"><div><span class="dot dot-comp"></span><span class="label">Completed</span></div><strong>' + info.completed + '</strong></div>' +
                    '<div class="mal-row"><div><span class="dot dot-hold"></span><span class="label">On-Hold</span></div><strong>' + info.on_hold + '</strong></div>' +
                    '<div class="mal-row"><div><span class="dot dot-drop"></span><span class="label">Dropped</span></div><strong>' + info.dropped + '</strong></div>' +
                    '<div class="mal-row"><div><span class="dot dot-plan"></span><span class="label">Plan to Watch</span></div><strong>' + info.plan_to_watch + '</strong></div>' +
                    '<div class="mal-row" style="margin-top:12px; border-top:1px solid #323238; padding-top:8px;"><span class="label">Total Entries</span><strong>' + info.totalEntries + '</strong></div>' +
                    '<div class="mal-row"><span class="label">Reassitidos</span><strong>' + info.rewatched + '</strong></div>' +
                    '<div class="mal-row"><span class="label">Episódios Totais</span><strong>' + info.episodes + '</strong></div>';
                
                wrapper.appendChild(box);
            });
        } catch(e) { wrapper.innerHTML = '<p>Erro ao montar painel MAL.</p>'; }
    }

    async function renderizarTopMidias() {
        try {
            const response = await fetch('/api/list');
            const data = await response.json();
            if (!data.list) return;

            const targets = { 'Anime': 'top-anime-grid', 'Série': 'top-serie-grid', 'Filme': 'top-filme-grid' };

            Object.keys(targets).forEach(tipo => {
                const gridEl = document.getElementById(targets[tipo]);
                
                // Ordena do maior pro menor baseado na nova nota numérica
                const filtrados = data.list
                    .filter(item => item.type === tipo && item.myRating !== null)
                    .sort((a, b) => b.myRating - a.myRating)
                    .slice(0, 3);

                if (filtrados.length === 0) {
                    gridEl.innerHTML = '<p style="color:#666; font-size:13px; margin: 5px 0;">Nenhuma mídia favoritada com nota.</p>';
                    return;
                }

                gridEl.innerHTML = '';
                filtrados.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = 'top-item';
                    div.innerHTML = 
                        '<div class="top-rank">#' + (idx + 1) + '</div>' +
                        '<img src="' + item.image + '" alt="">' +
                        '<div class="top-info">' +
                            '<h4>' + item.title + '</h4>' +
                            '<small>Sua Nota: <strong style="color:#ffa500;">⭐ ' + item.myRating + '/10</strong></small><br>' +
                            '<small style="font-size:11px;">Onde viu: ' + item.platform + '</small>' +
                        '</div>';
                    gridEl.appendChild(div);
                });
            });
        } catch (e) { console.error(e); }
    }

    // Função que consome a rota GET /api/stats do Node para alimentar os blocos do topo
    async function carregarEstatisticas() {
        try {
            const response = await fetch('/api/stats');
            const data = await response.json();

            // Criamos contadores zerados para consolidar o topo da tela
            let totalSalvo = 0;
            let totalWatching = 0;
            let totalCompleted = 0;
            let totalPlan = 0;
            let totalDropped = 0;
            let totalOnHold = 0;

            // Percorre cada tipo de mídia retornado pelo back-end (Anime, Série, Filme) e soma os status
            Object.keys(data).forEach(tipo => {
                const info = data[tipo];
                totalSalvo += info.totalEntries || 0;
                totalWatching += info.watching || 0;
                totalCompleted += info.completed || 0;
                totalPlan += info.plan_to_watch || 0;
                totalDropped += info.dropped || 0;
                totalOnHold += info.on_hold || 0;
            });

            // Injeta as somas consolidadas nos blocos visuais do painel superior
            document.getElementById('stat-total-val').innerText = totalSalvo;
            document.getElementById('stat-watching-val').innerText = totalWatching;
            document.getElementById('stat-completed-val').innerText = totalCompleted;
            document.getElementById('stat-plan-val').innerText = totalPlan;
            document.getElementById('stat-dropped-val').innerText = totalDropped;
            document.getElementById('stat-hold-val').innerText = totalOnHold;

        } catch (error) {
            console.error('Erro ao processar e somar as estatísticas:', error);
        }
    }


    // Função que consome a rota GET /api/list para desenhar os mini-cards horizontais
    async function carregarListaPessoal() {
        const savedGrid = document.getElementById('saved-grid');
        savedGrid.innerHTML = '<p>Carregando sua lista...</p>';

        try {
            const response = await fetch('/api/list');
            const data = await response.json();

            if (!data.list || data.list.length === 0) {
                savedGrid.innerHTML = '<p>Sua lista está vazia. Volte para a busca e adicione mídias!</p>';
                return;
            }

            savedGrid.innerHTML = '';
            
            // Dicionário para traduzir o ID do status interno para exibição amigável
            const statusTraduzido = {
                watching: 'Assistindo',
                completed: 'Completado',
                plan_to_watch: 'Planejado',
                dropped: 'Abandonado',
                on_hold: 'Em Espera'
            };

            // Dicionário de ícones visuais para sua nota customizada
            const iconesNota = {
                otimo: '🔥 Ótimo',
                bom: '👍 Bom',
                ruim: '👎 Ruim',
                pessimo: '💩 Péssimo'
            };

            data.list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                // Formatação legível das datas salvadas
                const dataInicio = item.startDate ? item.startDate.split('-').reverse().join('/') : 'Não iniciada';
                const dataFim = item.endDate ? item.endDate.split('-').reverse().join('/') : 'Não finalizada';
                const textoNota = iconesNota[item.myRating] || item.myRating;

                card.innerHTML = 
                    '<img src="' + item.image + '" alt="' + item.title + '">' +
                    '<div class="card-content">' +
                        '<div>' +
                            '<span class="badge badge-' + item.status + '">' + statusTraduzido[item.status] + '</span>' +
                            '<h3 class="title" title="' + item.title + '">' + item.title + '</h3>' +
                            '<p class="user-details">' +
                                '<strong>Tipo:</strong> ' + item.type + '<br>' +
                                '<strong>Onde:</strong> ' + item.platform + '<br>' +
                                '<strong>Início:</strong> ' + dataInicio + '<br>' +
                                '<strong>Fim:</strong> ' + dataFim + '' +
                            '</p>' +
                        '</div>' +
                        '<div class="rating-indicator">' +
                            'Minha Nota: ' + textoNota +
                        '</div>' +
                    '</div>';

                savedGrid.appendChild(card);
            });

        } catch (error) {
            savedGrid.innerHTML = '<p>Erro ao carregar sua lista.</p>';
            console.error(error);
        }
    }
</script>
</body>
</html>
